<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="wadah">
    <header>
      <h1>Pendaftaran Workshop Web</h1>
      <p class="sub">Isi data di bawah ini untuk mengamankan kursi Anda.</p>
    </header>

    <div class="grid">
      <form id="formWorkshop" novalidate>
        <div class="bidang">
          <label for="nama">Nama lengkap</label>
          <input id="nama" name="nama" type="text" maxlength="40" autocomplete="name">
          <div class="info"><span class="galat" id="galatNama" role="alert"></span>
            <span class="hitung"><span id="hitungNama">0</span>/40</span></div>
        </div>

        <div class="bidang">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email">
          <div class="info"><span class="galat" id="galatEmail" role="alert"></span></div>
        </div>

        <div class="bidang">
          <label for="sesi">Sesi workshop</label>
          <select id="sesi" name="sesi">
            <option value="">-- Pilih sesi --</option>
            <option value="HTML &amp; CSS Dasar — Sabtu 09.00">HTML &amp; CSS Dasar — Sabtu 09.00</option>
            <option value="JavaScript DOM — Sabtu 13.00">JavaScript DOM — Sabtu 13.00</option>
            <option value="Git &amp; GitHub — Minggu 09.00">Git &amp; GitHub — Minggu 09.00</option>
          </select>
          <div class="info"><span class="galat" id="galatSesi" role="alert"></span></div>
        </div>

        <div class="aksi">
          <button type="submit">Daftar</button>
          <button type="button" id="tombolReset" class="sekunder">Reset</button>
        </div>
        <p id="pesanForm" aria-live="polite"></p>
      </form>

      <aside class="ringkasan" aria-live="polite">
        <h2>Ringkasan Input</h2>
        <dl>
          <dt>Nama</dt><dd id="rNama">-</dd>
          <dt>Email</dt><dd id="rEmail">-</dd>
          <dt>Sesi</dt><dd id="rSesi">-</dd>
        </dl>
      </aside>
    </div>
  </main>
</body>
</html>
